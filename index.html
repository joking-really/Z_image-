<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZImage Generator</title>
    <style>
        :root {
            --bg: #0f0f11;
            --surface: #1a1a1f;
            --surface2: #222228;
            --border: #2e2e38;
            --text: #e4e4e7;
            --text-muted: #a1a1aa;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --accent-glow: rgba(124, 58, 237, 0.3);
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(124, 58, 237, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(124, 58, 237, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(100, 100, 120, 0.03) 0%, transparent 70%);
        }

        .container {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .header .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .header .logo .icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 0 24px var(--accent-glow);
        }

        .header .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.3);
        }

        .card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: -8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.01em;
        }

        textarea, input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            transition: var(--transition);
            outline: none;
        }

        textarea:focus, input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        textarea { min-height: 100px; line-height: 1.5; }
        textarea::placeholder { color: #52525b; }

        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            width: 100%;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 28px rgba(124, 58, 237, 0.45);
            transform: translateY(-1px);
        }

        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
            transform: none;
        }

        .btn svg { width: 18px; height: 18px; }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .result-area {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.35s ease;
        }

        .result-area.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-wrapper {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--surface2);
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: opacity 0.4s ease;
        }

        .image-wrapper img.loading-img {
            opacity: 0.4;
            filter: blur(10px);
        }

        .download-bar { display: flex; gap: 10px; align-items: center; }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            flex: 1;
        }

        .btn-outline:hover { background: var(--surface2); border-color: #52525b; }

        .toast {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.3s ease;
            border: 1px solid;
        }

        .toast.active { display: block; }
        .toast.error { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.35); color: #fca5a5; }
        .toast.info { background: rgba(124, 58, 237, 0.1); border-color: rgba(124, 58, 237, 0.3); color: #c4b5fd; }
        .toast.success { background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.35); color: #86efac; }
        .toast.warning { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.35); color: #fcd34d; }

        /* Debug panel */
        .debug-panel {
            display: none;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .debug-panel.active { display: block; }
        .debug-panel .debug-title {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            font-family: inherit;
        }
        .debug-panel .debug-line { margin: 2px 0; }
        .debug-panel .debug-key { color: #a78bfa; }
        .debug-panel .debug-value { color: #22c55e; }
        .debug-panel .debug-error { color: #ef4444; }
        .debug-panel .debug-warn { color: #f59e0b; }

        .debug-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            margin-top: -10px;
        }
        .debug-toggle:hover { color: var(--text); }

        @media (max-width: 520px) {
            .row { flex-direction: column; gap: 12px; }
            .card { padding: 16px; gap: 14px; }
            .header .logo { font-size: 1.4rem; }
            .header .logo .icon { width: 34px; height: 34px; font-size: 1.1rem; border-radius: 8px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="icon">✨</span>
                ZImage Generator
            </div>
            <p class="subtitle">Enter a prompt and generate an AI image instantly</p>
        </div>

        <div class="card" id="formCard">
            <span class="card-label">Prompt</span>
            <div class="form-group">
                <textarea id="prompt" placeholder="Describe the image you want to generate in detail...

e.g. A serene lakeside cabin at sunset with mist rolling over the water, golden light filtering through pine trees, photorealistic, 8k">book</textarea>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="width">Width (px)</label>
                    <input type="number" id="width" value="1024" min="64" max="2048" step="64">
                </div>
                <div class="form-group">
                    <label for="height">Height (px)</label>
                    <input type="number" id="height" value="1024" min="64" max="2048" step="64">
                </div>
                <div class="form-group">
                    <label for="steps">Steps</label>
                    <input type="number" id="steps" value="9" min="1" max="50" step="1">
                </div>
            </div>

            <button class="btn btn-primary" id="generateBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <polygon points="5 3 19 12 5 21 5 3" />
                </svg>
                Generate Image
            </button>

            <div class="toast error" id="errorToast"></div>
            <div class="toast info" id="infoToast"></div>
            <div class="toast success" id="successToast"></div>
            <div class="toast warning" id="warnToast"></div>

            <button class="debug-toggle" id="debugToggle" style="display:none;">Show Debug Log</button>
            <div class="debug-panel" id="debugPanel"></div>
        </div>

        <div class="card result-area" id="resultArea">
            <span class="card-label">Generated Image</span>
            <div class="image-wrapper" id="imageWrapper">
                <img id="generatedImage" src="" alt="Generated image will appear here" style="display:none;">
                <span id="placeholderText" style="color: #52525b; font-size: 0.9rem;">Your image will appear here</span>
            </div>
            <div class="download-bar">
                <button class="btn btn-outline" id="downloadBtn" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    Download PNG
                </button>
                <button class="btn btn-outline" id="newGenBtn" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    New Generation
                </button>
            </div>
        </div>
    </div>

<script>
(function() {
    const promptEl = document.getElementById('prompt');
    const widthEl = document.getElementById('width');
    const heightEl = document.getElementById('height');
    const stepsEl = document.getElementById('steps');
    const generateBtn = document.getElementById('generateBtn');
    const errorToast = document.getElementById('errorToast');
    const infoToast = document.getElementById('infoToast');
    const successToast = document.getElementById('successToast');
    const warnToast = document.getElementById('warnToast');
    const resultArea = document.getElementById('resultArea');
    const generatedImage = document.getElementById('generatedImage');
    const placeholderText = document.getElementById('placeholderText');
    const downloadBtn = document.getElementById('downloadBtn');
    const newGenBtn = document.getElementById('newGenBtn');
    const formCard = document.getElementById('formCard');
    const debugPanel = document.getElementById('debugPanel');
    const debugToggle = document.getElementById('debugToggle');

    const API_URL = 'https://jokinig-really--zimage-api-fastapi-app.modal.run/generate';

    let isGenerating = false;
    let currentImageDataUrl = null;
    let debugLogs = [];

    function log(level, ...args) {
        const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
        debugLogs.push({ level, msg, time: new Date().toLocaleTimeString() });
        console[level === 'error' ? 'error' : 'log'](...args);
        renderDebug();
    }

    function renderDebug() {
        if (debugLogs.length > 0) {
            debugToggle.style.display = 'block';
        }
        debugPanel.innerHTML = '<div class="debug-title">🔍 Debug Log (last 50 entries)</div>' +
            debugLogs.slice(-50).map(e => {
                const colorClass = e.level === 'error' ? 'debug-error' : e.level === 'warn' ? 'debug-warn' : 'debug-value';
                return `<div class="debug-line"><span class="debug-key">[${e.time}]</span> <span class="${colorClass}">${escapeHtml(e.msg)}</span></div>`;
            }).join('');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    debugToggle.addEventListener('click', () => {
        debugPanel.classList.toggle('active');
        debugToggle.textContent = debugPanel.classList.contains('active') ? 'Hide Debug Log' : 'Show Debug Log';
    });

    function hideToasts() {
        errorToast.classList.remove('active');
        infoToast.classList.remove('active');
        successToast.classList.remove('active');
        warnToast.classList.remove('active');
    }

    function showError(message) {
        hideToasts();
        errorToast.textContent = message;
        errorToast.classList.add('active');
        setTimeout(() => errorToast.classList.remove('active'), 10000);
    }

    function showInfo(message) {
        hideToasts();
        infoToast.textContent = message;
        infoToast.classList.add('active');
        setTimeout(() => infoToast.classList.remove('active'), 6000);
    }

    function showSuccess(message) {
        hideToasts();
        successToast.textContent = message;
        successToast.classList.add('active');
        setTimeout(() => successToast.classList.remove('active'), 6000);
    }

    function showWarn(message) {
        hideToasts();
        warnToast.textContent = message;
        warnToast.classList.add('active');
        setTimeout(() => warnToast.classList.remove('active'), 8000);
    }

    function setLoading(loading) {
        isGenerating = loading;
        generateBtn.disabled = loading;
        if (loading) {
            generateBtn.innerHTML = '<span class="spinner"></span> Generating...';
        } else {
            generateBtn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <polygon points="5 3 19 12 5 21 5 3" />
                </svg>
                Generate Image
            `;
        }
    }

    function base64ToDataUrl(base64, mimeType = 'image/png') {
        if (base64.startsWith('data:')) return base64;
        const cleaned = base64.replace(/\s/g, '');
        return `data:${mimeType};base64,${cleaned}`;
    }

    function isValidBase64(str) {
        try {
            return btoa(atob(str.replace(/\s/g, ''))) === str.replace(/\s/g, '');
        } catch {
            return false;
        }
    }

    function showImage(dataUrl) {
        currentImageDataUrl = dataUrl;
        generatedImage.src = dataUrl;
        generatedImage.style.display = 'block';
        generatedImage.classList.add('loading-img');
        placeholderText.style.display = 'none';

        generatedImage.onload = () => {
            generatedImage.classList.remove('loading-img');
        };

        if (generatedImage.complete && generatedImage.naturalWidth > 0) {
            generatedImage.classList.remove('loading-img');
        }

        generatedImage.onerror = () => {
            showError('Failed to load the generated image. The data may be corrupted.');
            log('error', 'Image onerror fired. Data URL length:', dataUrl.length);
        };

        resultArea.classList.add('active');
        resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function generateImage() {
        hideToasts();
        debugLogs = [];
        renderDebug();
        debugPanel.classList.remove('active');
        debugToggle.textContent = 'Show Debug Log';

        const prompt = promptEl.value.trim();
        if (!prompt) {
            showError('Please enter a prompt describing the image you want.');
            promptEl.focus();
            return;
        }

        const width = parseInt(widthEl.value, 10);
        const height = parseInt(heightEl.value, 10);
        const steps = parseInt(stepsEl.value, 10);

        if (isNaN(width) || width < 64 || width > 2048) {
            showError('Width must be between 64 and 2048 pixels.');
            widthEl.focus();
            return;
        }
        if (isNaN(height) || height < 64 || height > 2048) {
            showError('Height must be between 64 and 2048 pixels.');
            heightEl.focus();
            return;
        }
        if (isNaN(steps) || steps < 1 || steps > 50) {
            showError('Steps must be between 1 and 50.');
            stepsEl.focus();
            return;
        }

        setLoading(true);
        showInfo('Generating image... this may take 10-30 seconds on cold start.');
        log('info', 'Starting generation with prompt:', prompt, 'size:', width, 'x', height);

        const payload = { prompt, width, height, steps };

        try {
            log('info', 'POST', API_URL);
            const response = await fetch(API_URL, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json, image/*, */*'
                },
                body: JSON.stringify(payload),
            });

            log('info', 'Response status:', response.status, response.statusText);
            log('info', 'Response headers:', [...response.headers.entries()].map(h => h.join(': ')).join(', '));

            if (!response.ok) {
                let errorDetail = `API responded with status ${response.status}`;
                try {
                    const errBody = await response.text();
                    log('error', 'Error response body:', errBody.slice(0, 2000));
                    try {
                        const errJson = JSON.parse(errBody);
                        if (errJson.detail) errorDetail = errJson.detail;
                        else if (errJson.message) errorDetail = errJson.message;
                        else errorDetail = errBody;
                    } catch {
                        errorDetail = errBody || errorDetail;
                    }
                } catch {
                    // ignore
                }
                throw new Error(errorDetail);
            }

            const contentType = response.headers.get('content-type') || '';
            log('info', 'Content-Type:', contentType);

            let dataUrl = null;

            // Strategy 1: JSON response
            if (contentType.includes('application/json')) {
                const data = await response.json();
                log('info', 'JSON response keys:', Object.keys(data).join(', '));
                log('info', 'JSON response sample:', JSON.stringify(data).slice(0, 500));

                let base64Image = null;
                if (data.image_base64) base64Image = data.image_base64;
                else if (data.image) base64Image = data.image;
                else if (data.data) base64Image = data.data;
                else if (data.result) base64Image = data.result;
                else if (data.output) base64Image = data.output;
                else if (data.base64) base64Image = data.base64;
                else if (typeof data === 'string') base64Image = data;

                if (base64Image) {
                    dataUrl = base64ToDataUrl(base64Image);
                } else {
                    // Maybe it's a nested object?
                    const jsonStr = JSON.stringify(data);
                    const base64Match = jsonStr.match(/["']([A-Za-z0-9+/]{100,}={0,2})["']/);
                    if (base64Match) {
                        log('warn', 'Found base64 via regex in JSON');
                        dataUrl = base64ToDataUrl(base64Match[1]);
                    } else if (data.url || data.image_url) {
                        log('info', 'Found URL in JSON, fetching image...');
                        const imgUrl = data.url || data.image_url;
                        dataUrl = await fetchImageAsDataUrl(imgUrl);
                    } else {
                        throw new Error('No image data found in JSON response. Keys received: ' + Object.keys(data).join(', '));
                    }
                }
            }
            // Strategy 2: Direct image blob
            else if (contentType.includes('image/')) {
                log('info', 'Received direct image blob');
                const blob = await response.blob();
                dataUrl = await blobToDataUrl(blob);
            }
            // Strategy 3: Try JSON anyway even if content-type is wrong
            else {
                const text = await response.text();
                log('info', 'Response text (first 1000 chars):', text.slice(0, 1000));

                if (text.trim().startsWith('{') || text.trim().startsWith('[')) {
                    try {
                        const data = JSON.parse(text);
                        log('info', 'Parsed JSON from text. Keys:', Object.keys(data).join(', '));
                        let base64Image = data.image_base64 || data.image || data.data || data.result || data.output || data.base64;
                        if (base64Image) {
                            dataUrl = base64ToDataUrl(base64Image);
                        } else if (data.url || data.image_url) {
                            dataUrl = await fetchImageAsDataUrl(data.url || data.image_url);
                        } else {
                            throw new Error('JSON parsed but no image key found. Keys: ' + Object.keys(data).join(', '));
                        }
                    } catch (e) {
                        if (!dataUrl) throw e;
                    }
                } else if (text.length > 100 && isValidBase64(text.replace(/\s/g, ''))) {
                    log('info', 'Response appears to be raw base64 text');
                    dataUrl = base64ToDataUrl(text);
                } else {
                    throw new Error('Unexpected response format. Content-Type: ' + contentType);
                }
            }

            if (!dataUrl) {
                throw new Error('Could not extract image from response.');
            }

            log('info', 'Image data URL length:', dataUrl.length);
            showImage(dataUrl);
            hideToasts();
            showSuccess('✅ Image generated successfully!');

        } catch (error) {
            log('error', 'Generation error:', error.name, error.message);
            console.error('Generation error:', error);

            if (error.name === 'TypeError' && error.message.includes('fetch')) {
                showError('Network/CORS error: Unable to reach the API. If you see this on GitHub Pages, your Modal API likely lacks CORS headers on the POST response. Check the debug log below.');
                showWarn('💡 Tip: Add CORS middleware to your FastAPI app on Modal.');
            } else if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                showError('CORS/Network error. The Modal dashboard may show 200, but the browser blocked the response. Check debug log.');
            } else {
                showError(`Generation failed: ${error.message}`);
            }
        } finally {
            setLoading(false);
        }
    }

    async function fetchImageAsDataUrl(url) {
        log('info', 'Fetching image from URL:', url);
        const resp = await fetch(url, { mode: 'cors' });
        if (!resp.ok) throw new Error(`Failed to fetch image from URL: ${resp.status}`);
        const blob = await resp.blob();
        return await blobToDataUrl(blob);
    }

    function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    function downloadImage() {
        if (!currentImageDataUrl) {
            showError('No image to download yet. Generate one first!');
            return;
        }
        const link = document.createElement('a');
        link.href = currentImageDataUrl;
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const safePrompt = promptEl.value.trim().slice(0, 40).replace(/[^a-zA-Z0-9\s-]/g, '').replace(/\s+/g, '-') || 'image';
        link.download = `zimage-${safePrompt}-${timestamp}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showSuccess('📥 Image download started!');
    }

    function resetForNew() {
        resultArea.classList.remove('active');
        generatedImage.style.display = 'none';
        generatedImage.src = '';
        placeholderText.style.display = '';
        currentImageDataUrl = null;
        hideToasts();
        debugPanel.classList.remove('active');
        formCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        promptEl.focus();
    }

    generateBtn.addEventListener('click', generateImage);
    downloadBtn.addEventListener('click', downloadImage);
    newGenBtn.addEventListener('click', resetForNew);

    promptEl.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            generateImage();
        }
    });

    [widthEl, heightEl, stepsEl].forEach(el => {
        el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                generateImage();
            }
        });
    });

    console.log('✨ ZImage Generator ready. Tip: Press Ctrl+Enter in the prompt field to generate!');
})();
</script>
</body>
</html>
